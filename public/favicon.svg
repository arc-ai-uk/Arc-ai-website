<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#05060d"/>
    </radialGradient>

    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#2f6bff"/>
      <stop offset="50%" stop-color="#3fa9ff"/>
      <stop offset="100%" stop-color="#1e5fff"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7fb8ff"/>
      <stop offset="100%" stop-color="#3f7bff"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="200" height="200" fill="url(#bgGrad)"/>

  <!-- soft ambient glow behind arc -->
  <path d="M -20 120 A 140 140 0 0 1 220 120"
        fill="none" stroke="#2f6bff" stroke-width="14"
        stroke-linecap="round" opacity="0.35" filter="url(#softGlow)"/>

  <!-- main glowing arc -->
  <path d="M -20 120 A 140 140 0 0 1 220 120"
        fill="none" stroke="url(#arcGrad)" stroke-width="7"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- ARC-I wordmark -->
  <text x="100" y="140" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="26" letter-spacing="1" fill="url(#textGrad)">ARC-I</text>

  <!-- tagline -->
  <text x="100" y="158" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="600"
        font-size="9" letter-spacing="2.5" fill="#8a93a6">BUILD WHAT'S NEXT</text>
</svg>

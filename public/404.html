<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arc-I</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: redirects a deep-link 404
      // (e.g. /Arc-ai-website/about) to index.html with the path encoded
      // in the query string, so BrowserRouter can restore it on load.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep the "/Arc-ai-website" repo segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
